# Production on the VPS, installed as /opt/sites-platform/compose.prod.yaml.
# GitHub Actions builds the image and bin/app-deploy starts it:
#   SITES_IMAGE=sites-platform:<sha> docker compose -p sites-platform -f /opt/sites-platform/compose.prod.yaml up -d
# nginx proxies panel and sites to 127.0.0.1:3100.
services:
  app:
    image: ${SITES_IMAGE:?SITES_IMAGE is required (see /etc/sites-platform/current-image)}
    restart: unless-stopped
    # raw: values are literal ("$" in hashes and URIs is not interpolated).
    env_file:
      - path: /etc/sites-platform/app.env
        format: raw
      - path: /etc/sites-platform/secrets.env
        format: raw
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - /var/lib/sites-platform:/data
      - /etc/sites-platform/provisioner_ed25519:/run/provisioner/key:ro
      - /etc/sites-platform/known_hosts:/run/provisioner/known_hosts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
