# Example for the VPS. Requires DNS:
#   panel.whatever.tech      A  <VPS IP>
#   *.site.whatever.tech     A  <VPS IP>
# and a wildcard certificate for *.site.whatever.tech (Let's Encrypt DNS-01 challenge).

# Admin panel + API. It has no login: restrict it (basic auth, IP allowlist or VPN).
server {
    listen 443 ssl;
    server_name panel.whatever.tech;
    ssl_certificate     /etc/letsencrypt/live/panel.whatever.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.whatever.tech/privkey.pem;

    auth_basic "Panel";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 60m;   # >= MAX_UPLOAD_MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Published sites: <name>.site.whatever.tech
server {
    listen 443 ssl;
    server_name *.site.whatever.tech;
    ssl_certificate     /etc/letsencrypt/live/site.whatever.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.whatever.tech/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;   # the backend picks the site from Host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name panel.whatever.tech *.site.whatever.tech;
    return 301 https://$host$request_uri;
}
